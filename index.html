<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Verifica si tu PC puede correr un videojuego con tus componentes actuales." />
  <title>¿Puede tu PC correrlo?</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <main class="app-wrapper">

    <!-- Header -->
    <h1 class="site-title">¿Puede tu PC correrlo?</h1>
    <p class="site-subtitle">// ingresa tus componentes · busca un juego · verifica</p>

    <!-- Card 1 — Hardware inputs -->
    <section class="card" aria-labelledby="components-label">
      <p class="section-label" id="components-label">Tus componentes</p>
      <div class="field-grid">

        <div class="field-group">
          <label class="field-label" for="gpu-input">GPU (tarjeta gráfica)</label>
          <div class="autocomplete-wrap">
            <input type="text" id="gpu-input" placeholder="Ej: RTX 3060" autocomplete="off" />
            <div class="dropdown" id="gpu-dropdown" role="listbox" aria-label="Sugerencias de GPU"></div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="cpu-input">CPU (procesador)</label>
          <div class="autocomplete-wrap">
            <input type="text" id="cpu-input" placeholder="Ej: i5-12400F" autocomplete="off" />
            <div class="dropdown" id="cpu-dropdown" role="listbox" aria-label="Sugerencias de CPU"></div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="ram-input">RAM (GB)</label>
          <input type="number" id="ram-input" placeholder="Ej: 16" min="1" max="256" />
        </div>

        <div class="field-group">
          <label class="field-label" for="vram-input">
            VRAM (GB) <span class="optional">(opcional)</span>
          </label>
          <input type="number" id="vram-input" placeholder="Ej: 8" min="1" max="48" />
        </div>

      </div>
    </section>

    <!-- Card 2 — Game search -->
    <section class="card" aria-labelledby="game-label">
      <p class="section-label" id="game-label">Buscar juego</p>
      <div class="game-search-wrap">
        <input type="text" id="game-input" placeholder="Escribe el nombre del juego…" autocomplete="off" />
        <div class="game-dropdown" id="game-dropdown" role="listbox" aria-label="Resultados de búsqueda"></div>
      </div>
      <div id="game-status"></div>
      <div id="selected-game-display" style="display:none"></div>
      <button class="btn-check" id="check-btn" disabled>
        Verificar compatibilidad
      </button>
    </section>

    <!-- Card 3 — Result (hidden until check runs) -->
    <section class="card result-card" id="result-card" aria-live="polite">
      <div class="result-header">
        <span class="result-badge" id="result-badge">—</span>
        <span class="result-game-name" id="result-game-name">—</span>
      </div>
      <div id="result-body"></div>
    </section>

  </main>

  <!-- Scripts: data first, then API, then logic, then init -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/search.js"></script>
  <script src="js/compatibility.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
