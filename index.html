<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Check if your PC can run a video game based on your current hardware." />
  <title>Will it run?</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <main class="app-wrapper">

    <!-- Header -->
    <div class="site-header">
      <div class="site-header-text">
        <h1 class="site-title" id="site-title">Will it run?</h1>
        <p class="site-subtitle" id="site-subtitle">// ingresa tus componentes · busca un juego · verifica</p>
      </div>
      <!-- Theme + language controls -->
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <button class="btn-theme" id="theme-toggle" aria-label="Toggle theme">■ Oscuro</button>
        <div class="lang-controls" aria-label="Language selector">
          <button class="btn-lang btn-lang--active" data-lang="es">ES</button>
          <button class="btn-lang" data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <!-- Card 1 — Hardware inputs -->
    <section class="card" aria-labelledby="components-label">
      <p class="section-label" id="components-label">Tus componentes</p>
      <div class="field-grid">

        <div class="field-group">
          <label class="field-label" for="gpu-input">GPU (tarjeta gráfica)</label>
          <div class="autocomplete-wrap">
            <input type="text" id="gpu-input" placeholder="Ej: RTX 3060" autocomplete="off" />
            <div class="dropdown" id="gpu-dropdown" role="listbox" aria-label="GPU suggestions"></div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="cpu-input">CPU (procesador)</label>
          <div class="autocomplete-wrap">
            <input type="text" id="cpu-input" placeholder="Ej: i5-12400F" autocomplete="off" />
            <div class="dropdown" id="cpu-dropdown" role="listbox" aria-label="CPU suggestions"></div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="ram-input">RAM (GB)</label>
          <input type="number" id="ram-input" placeholder="Ej: 16" min="1" max="256" />
        </div>

        <div class="field-group">
          <label class="field-label" for="vram-input">
            VRAM (GB) <span class="optional">(opcional)</span>
          </label>
          <input type="number" id="vram-input" placeholder="Ej: 8" min="1" max="48" />
        </div>

      </div>
    </section>

    <!-- Card 2 — Game search; card--overflow allows dropdown to escape card bounds -->
    <section class="card card--overflow" aria-labelledby="game-label">
      <p class="section-label" id="game-label">Buscar juego</p>
      <div class="game-search-wrap">
        <input type="text" id="game-input" placeholder="Escribe el nombre del juego…" autocomplete="off" />
        <div class="game-dropdown" id="game-dropdown" role="listbox" aria-label="Game search results"></div>
      </div>
      <div id="game-status"></div>
      <div id="selected-game-display" style="display:none"></div>
      <button class="btn-check" id="check-btn" disabled>
        Verificar compatibilidad
      </button>
    </section>

    <!-- Card 3 — Result (hidden until check runs) -->
    <section class="card result-card" id="result-card" aria-live="polite">
      <div class="result-header">
        <span class="result-badge" id="result-badge">—</span>
        <span class="result-game-name" id="result-game-name">—</span>
      </div>
      <div id="result-body"></div>
    </section>

  </main>

  <!-- i18n first, then data, api, logic, init -->
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/search.js"></script>
  <script src="js/compatibility.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
